name: Roll back website to current v2 checkpoint

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current Apple feed authority
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download and verify preserved site
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_TAG: production-rollback-2026-08-25-current-v2
          ROLLBACK_SHA256: 85e0a9a91702994f38c7a9122708ab8a4f14bf5cfce3caf575804c492650f535
        run: |
          mkdir -p rollback-package/site
          gh release download "$ROLLBACK_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern artifact.tar \
            --dir rollback-package
          echo "$ROLLBACK_SHA256  rollback-package/artifact.tar" | sha256sum --check -
          tar -xf rollback-package/artifact.tar -C rollback-package/site
          test -f rollback-package/site/CNAME
          grep -Fxq drmexperienced.com rollback-package/site/CNAME
          test -f rollback-package/site/index.html
          test -f rollback-package/site/404.html
          test -f rollback-package/site/episodes/episode-8-food-and-the-brain/index.html

      - name: Generate and verify current authorized Apple subtree
        run: |
          npm run generate:authorized-apple-subtree
          npm run verify:authorized-apple-subtree

      - name: Inject and verify current authorized Apple subtree
        id: apple_feed_evidence
        run: |
          set -euo pipefail
          rm -rf rollback-package/site/apple-podcasts
          cp -a out/apple-podcasts rollback-package/site/apple-podcasts
          npm run verify:authorized-apple-subtree -- --site-root=rollback-package/site
          sha256="$(sha256sum rollback-package/site/apple-podcasts/feed.xml | cut -d ' ' -f 1)"
          if ! [[ "$sha256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Could not calculate the rollback Apple feed SHA-256."
            exit 1
          fi
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload preserved site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: rollback-package/site

      - name: Deploy preserved site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify public Apple feed after rollback
        env:
          EXPECTED_APPLE_FEED_SHA256: ${{ steps.apple_feed_evidence.outputs.sha256 }}
        run: npm run verify:apple-authorized-subtree-deployment
