    <rect x="112" y="552" width="72" height="72" rx="8" fill="#F1F5F9"/>
    <use href="#switchback-full" x="136" y="576" width="24" height="24"/>
    <rect x="200" y="552" width="88" height="88" rx="8" fill="#F1F5F9"/>
