    <text class="label" x="134" y="648">24</text>
    <text class="label" x="236" y="664">64</text>
    <text x="24" y="710" fill="#475569" font-size="14">Most open and conversational; least emblematic.</text>
  </g>

  <g transform="translate(508 104)">
    <rect width="424" height="756" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text class="name" x="24" y="42">02 / CUTLINE</text>
