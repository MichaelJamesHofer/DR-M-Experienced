    <use href="#cutline-full" x="52" y="580" width="16" height="16"/>
    <rect x="112" y="552" width="72" height="72" rx="8" fill="#F1F5F9"/>
    <use href="#cutline-full" x="136" y="576" width="24" height="24"/>
    <rect x="200" y="552" width="88" height="88" rx="8" fill="#F1F5F9"/>
    <use href="#cutline-full" x="212" y="564" width="64" height="64"/>
    <text class="label" x="49" y="648">16</text>
    <text class="label" x="134" y="648">24</text>
    <text class="label" x="236" y="664">64</text>
    <text x="24" y="710" fill="#475569" font-size="14">Strongest emblem; narrow route is the small-size risk.</text>
  </g>

  <g transform="translate(976 104)">
    <rect width="424" height="756" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text class="name" x="24" y="42">03 / WAYPOINT STEPS</text>
    <text class="label" x="24" y="70">Terraced M / central experience marker</text>
