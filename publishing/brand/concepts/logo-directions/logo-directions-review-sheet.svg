<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Dr. M Experienced logo directions - first identity review</title>
  <desc id="desc">Three distinct M and path logo directions shown as horizontal lockups, dark-field variants, one-color marks, circular crops, and true-size 16, 24, and 64 pixel tests.</desc>
  <style>
    @font-face { font-family: "Geist Review"; src: url("../../../../src/app/fonts/GeistVF.woff") format("woff"); font-weight: 100 900; }
    text { font-family: "Geist Review", Inter, Arial, sans-serif; letter-spacing: 0; }
    .label { fill: #475569; font-size: 14px; font-weight: 600; }
    .name { fill: #0A0F1A; font-size: 24px; font-weight: 700; }
  </style>
  <defs>
    <symbol id="switchback-full" viewBox="0 0 64 64">
      <path d="M13 50V20L32 43L51 20V50" fill="none" stroke="#22D3EE" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="48" y="16" width="7" height="7" fill="#F59E0B"/>
    </symbol>
    <symbol id="switchback-one" viewBox="0 0 64 64">
      <path d="M13 50V20L32 43L51 20V50" fill="none" stroke="#0A0F1A" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="48" y="16" width="7" height="7" fill="#0A0F1A"/>
    </symbol>
    <symbol id="cutline-full" viewBox="0 0 64 64">
      <path d="M11 51V15H20L32 36L44 15H53V51H43V35L32 54L21 35V51ZM17 51H23L48 20H42Z" fill="#22D3EE" fill-rule="evenodd"/>
      <rect x="42" y="16" width="7" height="7" fill="#F59E0B"/>
    </symbol>
    <symbol id="cutline-one" viewBox="0 0 64 64">
      <path d="M11 51V15H20L32 36L44 15H53V51H43V35L32 54L21 35V51ZM17 51H23L48 20H42Z" fill="#0A0F1A" fill-rule="evenodd"/>
    </symbol>
    <symbol id="steps-full" viewBox="0 0 64 64">
      <path d="M10 52V14H18V20H22V26H26V32H30V38H34V32H38V26H42V20H46V14H54V52H46V32H42V38H38V44H34V50H30V44H26V38H22V32H18V52Z" fill="#22D3EE"/>
      <rect x="30" y="42" width="4" height="6" fill="#F59E0B"/>
