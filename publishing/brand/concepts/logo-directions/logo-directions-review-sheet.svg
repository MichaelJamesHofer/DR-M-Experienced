    <symbol id="steps-one" viewBox="0 0 64 64">
      <path d="M10 52V14H18V20H22V26H26V32H30V38H34V32H38V26H42V20H46V14H54V52H46V32H42V38H38V44H34V50H30V44H26V38H22V32H18V52Z" fill="#0A0F1A"/>
    </symbol>
  </defs>

  <rect width="1440" height="920" fill="#F8FAFC"/>
  <text x="40" y="48" fill="#0A0F1A" font-size="30" font-weight="700">DR. M EXPERIENCED - IDENTITY ROUND 01</text>
  <text x="40" y="76" fill="#475569" font-size="16" font-weight="500">Review concepts only. No direction is an approved master or authorized for production use.</text>

  <g transform="translate(40 104)">
    <rect width="424" height="756" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text class="name" x="24" y="42">01 / SWITCHBACK</text>
    <text class="label" x="24" y="70">Continuous path / widest human gesture</text>
    <image href="direction-01-switchback-lockup-horizontal.svg" x="24" y="92" width="376" height="84"/>
    <rect x="24" y="202" width="376" height="138" rx="8" fill="#0A0F1A"/>
    <use href="#switchback-full" x="42" y="230" width="80" height="80"/>
    <text x="136" y="264" fill="#F1F5F9" font-size="23" font-weight="700">DR. M EXPERIENCED</text>
    <text x="136" y="291" fill="#94A3B8" font-size="14" font-weight="500">with Dr. David Musnick</text>
    <text class="label" x="24" y="378">FULL COLOR</text>
    <use href="#switchback-full" x="24" y="392" width="96" height="96"/>
    <text class="label" x="150" y="378">ONE COLOR</text>
    <use href="#switchback-one" x="150" y="392" width="96" height="96"/>
