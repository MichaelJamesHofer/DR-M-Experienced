    <rect x="24" y="202" width="376" height="138" rx="8" fill="#0A0F1A"/>
    <use href="#steps-full" x="42" y="230" width="80" height="80"/>
    <text x="136" y="264" fill="#F1F5F9" font-size="23" font-weight="700">DR. M EXPERIENCED</text>
    <text x="136" y="291" fill="#94A3B8" font-size="14" font-weight="500">with Dr. David Musnick</text>
    <text class="label" x="24" y="378">FULL COLOR</text>
    <use href="#steps-full" x="24" y="392" width="96" height="96"/>
    <text class="label" x="150" y="378">ONE COLOR</text>
    <use href="#steps-one" x="150" y="392" width="96" height="96"/>
    <text class="label" x="276" y="378">CIRCLE CROP</text>
    <circle cx="324" cy="440" r="48" fill="#0A0F1A"/>
    <use href="#steps-full" x="276" y="392" width="96" height="96"/>
    <text class="label" x="24" y="535">TRUE-SIZE CHECKS</text>
    <rect x="24" y="552" width="72" height="72" rx="8" fill="#F1F5F9"/>
    <use href="#steps-full" x="52" y="580" width="16" height="16"/>
    <rect x="112" y="552" width="72" height="72" rx="8" fill="#F1F5F9"/>
    <use href="#steps-full" x="136" y="576" width="24" height="24"/>
    <rect x="200" y="552" width="88" height="88" rx="8" fill="#F1F5F9"/>
    <use href="#steps-full" x="212" y="564" width="64" height="64"/>
    <text class="label" x="49" y="648">16</text>
    <text class="label" x="134" y="648">24</text>
    <text class="label" x="236" y="664">64</text>
